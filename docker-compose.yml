services:
  app:
    image: bethanys-v2
    build: .
    ports:
      - 19000:19000
      - 19001:19001
      - 19002:19002
      - 19006:19006
      # - 8081:8081
    environment:
      - NODE_ENV=development
      - EXPO_PACKAGER_PORT=19001
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=host.docker.internal
    volumes:
      - ./bethanys-v2:/app/
    # command: ["expo", "start", "--tunnel"]
